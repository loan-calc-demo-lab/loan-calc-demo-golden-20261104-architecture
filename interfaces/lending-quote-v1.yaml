openapi: 3.1.0
info: { title: Lending – loan quote, version: 1.0.0 }
paths:
  /loan/quote:
    post:
      summary: Quote for an annuity personal loan (monthly payment, schedule, APR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal, annual_rate_pct, term_months]
              properties:
                principal: { type: number, description: EUR, > 0 and <= 1,000,000 }
                annual_rate_pct: { type: number, description: nominal yearly rate in percent, 0..30 }
                term_months: { type: integer, minimum: 1, maximum: 360 }
                upfront_fee: { type: number, default: 0, description: EUR }
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  monthly_payment: { type: number }
                  total_interest: { type: number }
                  upfront_fee: { type: number }
                  total_payable: { type: number }
                  total_cost_of_credit: { type: number }
                  apr_pct: { type: number, description: percent, one decimal }
                  schedule: { type: array, items: { type: object } }
        "422": { description: "Validation error: {error, field, message}" }
