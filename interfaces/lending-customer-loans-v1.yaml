openapi: 3.1.0
info: { title: Lending – existing loans of a customer, version: 1.0.0 }
paths:
  /customers/{customer_id}/loans:
    get:
      summary: The customer's existing personal loans
      parameters:
        - { name: customer_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Loans (empty list for an unknown customer)
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id: { type: string }
                  loans:
                    type: array
                    items:
                      type: object
                      properties:
                        loan_id: { type: string }
                        customer_id: { type: string }
                        product: { type: string }
                        original_principal: { type: number }
                        annual_rate_pct: { type: number }
                        term_months: { type: integer }
                        payments_made: { type: integer }
                        remaining_term_months: { type: integer }
                        outstanding_balance: { type: number }
                        monthly_payment: { type: number }
                        in_arrears: { type: boolean }
                        repayment_account_id: { type: string, description: current account in Deposits }
