openapi: 3.1.0
info:
  title: Deposits Payouts API
  version: "1"
paths:
  /payouts:
    post:
      summary: Create a payout
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, amount, reference]
              properties:
                account_id:
                  type: string
                amount:
                  type: number
                reference:
                  type: string
      responses:
        '201':
          description: Payout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  payout_id:
                    type: string
                  account_id:
                    type: string
                  amount:
                    type: number
                  reference:
                    type: string
                  new_balance:
                    type: number
                  created_at:
                    type: string
                    format: date-time
        '200':
          description: Idempotent repeat, same result, no additional credit
        '400':
          description: Idempotency-Key header missing or empty (malformed request)
        '404':
          description: Unknown account
        '409':
          description: Idempotency-Key conflict with different body
        '422':
          description: Amount not positive
