openapi: 3.1.0
info: { title: Deposits – account balance, version: 1.0.0 }
paths:
  /v1/accounts/{account_id}/balance:
    get:
      summary: Balance of a current account
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: string }
                  balance: { type: number }
        "404": { description: Unknown account }
